//ACTUALLY DRAWING THE LEVEL OUT

function play(){

    levelTitle.innerHTML = titleList[currentStage];


    player.clearRect(0,0,canvas.width,canvas.height);
    drawLevel(levely[currentStage + 0]);



for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
            if(rows[y][x] === "%"){
                player.fillStyle = "yellow";
                player.drawImage(goalSprite,x * 50, y * 50, 50, 50);
            }
            
        }
}

for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
            if(rows[y][x] === "*"){
                player.fillStyle = "DarkRed";
                player.drawImage(spikeSprite,x * 50, y * 50, 50, 50);
            }
            
        }
}

for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
            if(rows[y][x] === "+" && !temporaryBrokenCords.some(([by,bx]) => by === y && bx === x)){
                player.fillStyle = "DarkOliveGreen";
                player.drawImage(springSprite,x * 50, y * 50, 50, 50);
        }

            
        }
}
for(let p = 1;p <= 5; p++){
for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
            if(rows[y][x] == p && !temporaryBrokenCords.some(([by,bx]) => by === y && bx === x)){
                player.fillStyle = "Purple";
                player.drawImage(portalSprite,x * 50, y * 50, 50, 50);
        }

            
        }
}
}
if(isMoving===false){
drawPlayer("idle");
}else{
drawPlayer(playerDirection);
}

requestAnimationFrame(() => play());
}

function drawPlayer(direction){
    player.fillStyle = "red";

    if(direction === "idle"){
    player.drawImage(playerSprite,playerX*50, playerY*50, 50, 50);
    }else if(direction === "up"){
    player.drawImage(moveUp,playerX*50, playerY*50, 50, 50)
    }else if(direction === "down"){
    player.drawImage(moveDown,playerX*50, playerY*50, 50, 50)
    }else if(direction === "right"){
    player.drawImage(moveRight,playerX*50, playerY*50, 50, 50)
    }else if(direction === "left"){
    player.drawImage(moveLeft,playerX*50, playerY*50, 50, 50)
    }
}

function drawPlayerStart(){
    temporaryBrokenCords = [];
for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
            if(rows[y][x] === "@"){
                player.fillStyle = "red";
                player.drawImage(playerSprite, x * 50, y * 50, 50, 50);
                playerX = x;
                playerY = y;
            }
            
        }
}
}
